[project]
name = "pet-breed-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davit Tavadze", email = "davitit9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.31.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pet-breed-classifier = "pet_breed_classifier:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
